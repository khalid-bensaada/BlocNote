<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bloc Note</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Manrope", "system-ui", "sans-serif"] },
            colors: {
              ink: "#1b1f2a",
              mute: "#6b7280",
              paper: "#f6f7f9",
              accent: "#4f46e5",
              mint: "#0d9488",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-paper text-ink font-sans antialiased min-h-screen">
    <header
      class="max-w-6xl mx-auto px-5 pt-10 pb-6 flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between"
    >
      <div>
        <h1 class="text-4xl font-extrabold tracking-tight">Bloc Note</h1>
        <p id="count" class="text-mute mt-1 text-sm"></p>
      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <input
          id="search"
          type="search"
          placeholder="Search notes"
          aria-label="Search notes"
          class="flex-1 sm:w-72 rounded-xl border border-gray-200 bg-white px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-accent/40 transition"
        />
        <button
          id="new"
          class="rounded-xl bg-accent text-white font-bold px-5 py-2.5 text-sm hover:bg-indigo-700 active:scale-95 transition"
        >
          New note
        </button>
      </div>
    </header>

    <nav
      id="tags"
      class="max-w-6xl mx-auto px-5 pb-4 flex flex-wrap gap-2"
      aria-label="Filter by tag"
    ></nav>

    <main class="max-w-6xl mx-auto px-5 pb-20">
      <div id="grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      <div id="empty" class="hidden text-center py-24 text-mute">
        <p id="empty-text" class="text-lg"></p>
      </div>
    </main>

    <!-- Editor -->
    <dialog id="editor" class="w-[min(40rem,94vw)] rounded-2xl p-0 shadow-2xl">
      <div class="p-6 flex flex-col gap-4">
        <input
          id="f-title"
          placeholder="Title"
          maxlength="120"
          aria-label="Title"
          class="text-2xl font-extrabold outline-none placeholder:text-gray-300 w-full"
        />
        <textarea
          id="f-body"
          rows="10"
          placeholder="Start writing…"
          aria-label="Note content"
          class="w-full resize-none outline-none leading-relaxed text-[15px] placeholder:text-gray-300"
        ></textarea>
        <input
          id="f-tags"
          placeholder="Tags, separated by commas"
          aria-label="Tags"
          class="text-sm rounded-lg bg-paper px-3 py-2 outline-none focus:ring-2 focus:ring-accent/40"
        />
        <div class="flex items-center justify-between pt-2">
          <span id="f-date" class="text-xs text-mute"></span>
          <div class="flex gap-2">
            <button
              id="cancel"
              class="px-4 py-2 rounded-lg text-sm font-medium text-mute hover:bg-paper transition"
            >
              Cancel
            </button>
            <button
              id="save"
              class="px-5 py-2 rounded-lg text-sm font-bold bg-accent text-white hover:bg-indigo-700 transition"
            >
              Save note
            </button>
          </div>
        </div>
      </div>
    </dialog>

    <!-- Delete confirmation -->
    <dialog id="confirm" class="w-[min(24rem,92vw)] rounded-2xl p-0 shadow-2xl">
      <div class="p-6">
        <h2 class="text-lg font-extrabold">Delete this note?</h2>
        <p id="confirm-title" class="text-sm text-mute mt-1 truncate"></p>
        <p class="text-sm text-mute mt-3">This can't be undone.</p>
        <div class="flex justify-end gap-2 mt-6">
          <button
            id="no"
            class="px-4 py-2 rounded-lg text-sm font-medium text-mute hover:bg-paper transition"
          >
            Keep note
          </button>
          <button
            id="yes"
            class="px-5 py-2 rounded-lg text-sm font-bold bg-red-600 text-white hover:bg-red-700 transition"
          >
            Delete note
          </button>
        </div>
      </div>
    </dialog>

    <script src="js/app.js"></script>
  </body>
</html>
